name: RetailEdge CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'retailedge-sandbox' }}
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET || 'retailedge-sandbox-codedeploy' }}
  CODEDEPLOY_APPLICATION: ${{ vars.CODEDEPLOY_APPLICATION || 'retailedge-sandbox' }}
  CODEDEPLOY_GROUP: ${{ vars.CODEDEPLOY_GROUP || 'retailedge-sandbox' }}
  APP_PATH: ${{ vars.APP_PATH || 'app' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Run tests
        run: ./scripts/test.sh

  build:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "$IMAGE_URI" "$APP_PATH"
          docker push "$IMAGE_URI"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: retailedge-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Prepare CodeDeploy revision
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          rm -rf release
          mkdir -p release/deploy/scripts
          cp deploy/appspec.yml release/appspec.yml
          cp deploy/scripts/*.sh release/deploy/scripts/
          cat > release/deploy/config.env <<EOF
          AWS_REGION=${AWS_REGION}
          ECR_REGISTRY=$(echo "${IMAGE_URI}" | cut -d/ -f1)
          IMAGE_URI=${IMAGE_URI}
          EOF
          cd release
          zip -r ../release.zip .
      - name: Upload revision
        run: aws s3 cp release.zip "s3://${ARTIFACT_BUCKET}/releases/${GITHUB_SHA}.zip"
      - name: Start CodeDeploy deployment
        run: |
          aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APPLICATION" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location bucket="$ARTIFACT_BUCKET",key="releases/${GITHUB_SHA}.zip",bundleType=zip \
            --description "RetailEdge ${GITHUB_SHA}"
